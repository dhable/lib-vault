[workspace]
resolver = "3"
members = ["lib-vault", "lib-vault-posix", "lib-vault-memory", "lib-vault-sqlite"]

# Shared package metadata. Member crates opt in with `<field>.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

# Shared dependency versions and features. Member crates opt in with
# `<name>.workspace = true` so every crate uses the same definition.
[workspace.dependencies]
tracing = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2"
bytes = "1.12"
rustix = { version = "1.1", features = ["fs", "process"] }
tokio = { version = "1.53", default-features = false }
tokio-util = { version = "0.7", default-features = false }
tempfile = "3"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }

# Workspace crates, referenced by path.
lib-vault = { path = "lib-vault" }
lib-vault-memory = { path = "lib-vault-memory" }
